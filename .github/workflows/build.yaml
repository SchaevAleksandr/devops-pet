name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Даем права на запись в реестр GitHub
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Включаем Docker Buildx (продвинутый сборщик)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логинимся в реестр GitHub (используя встроенный токен)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем и пушим образ
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Имя образа должно быть в нижнем регистре: ghcr.io/ваш_ник/имя_репо
          tags: ghcr.io/${{ github.repository }}:latest
